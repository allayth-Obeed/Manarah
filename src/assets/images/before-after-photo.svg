<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <style>
    .title{font-family:Inter, Arial, sans-serif; font-size:28px; fill:#0f172a}
    .arabic{font-family:Inter, Arial, sans-serif; font-size:16px; fill:#0f172a}
    .small{font-size:14px; fill:#64748b}
  </style>
  <rect width="1200" height="627" fill="#f8fafc"/>

  <!-- Left: Light mode mockup -->
  <g transform="translate(40,40)">
    <rect width="540" height="507" rx="16" fill="#ffffff" stroke="#e6eef8"/>
    <text x="30" y="46" class="title">Light — Manarah</text>
    <g transform="translate(30,80)">
      <rect width="480" height="340" rx="12" fill="#f8fafc"/>
      <rect x="20" y="20" width="120" height="80" rx="8" fill="#2563eb"/>
      <rect x="160" y="20" width="300" height="28" rx="6" fill="#0f172a"/>
      <rect x="160" y="60" width="220" height="20" rx="6" fill="#64748b"/>
      <rect x="20" y="120" width="440" height="24" rx="6" fill="#0f172a" opacity="0.95"/>
      <rect x="20" y="156" width="200" height="16" rx="6" fill="#64748b"/>
    </g>
    <text x="30" y="460" class="small">نص واضح على خلفية فاتحة — تباين مُحسّن</text>
  </g>

  <!-- Right: Dark mode mockup -->
  <g transform="translate(620,40)">
    <rect width="540" height="507" rx="16" fill="#071126" stroke="#0b1220"/>
    <text x="30" y="46" class="title" style="fill:#e6eef8">Dark — Manarah</text>
    <g transform="translate(30,80)">
      <rect width="480" height="340" rx="12" fill="#071a2b"/>
      <rect x="20" y="20" width="120" height="80" rx="8" fill="#60a5fa"/>
      <rect x="160" y="20" width="300" height="28" rx="6" fill="#e6eef8"/>
      <rect x="160" y="60" width="220" height="20" rx="6" fill="#94a3b8"/>
      <rect x="20" y="120" width="440" height="24" rx="6" fill="#e6eef8" opacity="0.92"/>
      <rect x="20" y="156" width="200" height="16" rx="6" fill="#94a3b8"/>
    </g>
    <text x="30" y="460" class="small" style="fill:#94a3b8">نص متباين على خلفية داكنة — مناسب للقراءة</text>
  </g>

  <!-- Center overlay info -->
  <g transform="translate(0,520)">
    <text x="40" y="18" class="arabic">تبديل الوضع — سريع، محفوظ، ومتوافق مع الوصولية</text>
    <text x="460" y="18" class="arabic">استعمل `prefers-color-scheme` و`localStorage` للحفظ</text>
  </g>

  <!-- CTA badge -->
  <!-- CTA badge removed as requested -->
</svg>
